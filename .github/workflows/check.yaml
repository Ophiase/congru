name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: clippy, rustfmt
      - uses: extractions/setup-just@v3
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked rumdl
      - run: just check

  figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - uses: Swatinem/rust-cache@v2
      - name: The committed figures are the ones the code draws
        run: just figures && git diff --exit-code -- docs/figures/*.svg
