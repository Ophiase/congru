[workspace]
resolver = "3"
members = [
  "crates/congru",
  "crates/congru-synth",
  "crates/congru-figures",
  "crates/congru-bench",
  "crates/congru-vision",
  "crates/congru-sim",
  "crates/congru-demo",
  "crates/congru-python",
  "crates/congru-track",
  "crates/congru-scene",
  "crates/congru-cli",
  "crates/congru-capi",
]

[workspace.package]
version = "0.1.17"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Ophiase/congru"
keywords = [
  "point-cloud",
  "registration",
  "icp",
  "robotics",
  "computer-vision",
]
categories = [
  "computer-vision",
  "science::robotics",
  "mathematics",
]

[workspace.dependencies]
congru = { path = "crates/congru", version = "0.1.17" }
congru-synth = { path = "crates/congru-synth", version = "0.1.17" }
congru-vision = { path = "crates/congru-vision", version = "0.1.17" }
congru-sim = { path = "crates/congru-sim", version = "0.1.17" }
congru-track = { path = "crates/congru-track", version = "0.1.17" }
congru-scene = { path = "crates/congru-scene", version = "0.1.17" }
kiddo = { version = "6.3.0", default-features = false }
nalgebra = "0.35.0"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
rayon = "1.12.0"
thiserror = "2.0.21"
rand = { version = "0.10.3", default-features = false, features = [
  "std",
  "chacha",
] }
rand_distr = { version = "0.6.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
