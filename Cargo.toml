[workspace]
resolver = "3"
members = [
  "crates/recalage",
  "crates/recalage-synth",
  "crates/recalage-bench",
  "crates/recalage-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/ophiase/recalage"
keywords = [
  "point-cloud",
  "registration",
  "icp",
  "robotics",
  "computer-vision",
]
categories = [
  "computer-vision",
  "science::robotics",
  "mathematics",
]

[workspace.dependencies]
recalage = { path = "crates/recalage", version = "0.1.0" }
recalage-synth = { path = "crates/recalage-synth", version = "0.1.0" }
kiddo = { version = "6.3.0", default-features = false }
nalgebra = "0.35.0"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
rayon = "1.12.0"
thiserror = "2.0.21"
rand = { version = "0.10.3", default-features = false, features = [
  "std",
  "chacha",
] }
rand_distr = { version = "0.6.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
