[package]
name = "congru"
description = "Fast, robust rigid registration of point clouds and meshes: ICP variants, robust kernels, closed-form fits."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["parallel"]
parallel = [
  "dep:rayon",
  "kiddo/multi-threaded",
]

[dependencies]
kiddo.workspace = true
nalgebra.workspace = true
rayon = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
rand.workspace = true
congru-synth = { path = "../congru-synth" }
