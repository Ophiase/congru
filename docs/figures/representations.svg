<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Helvetica, Arial, sans-serif">
  <title>A shape held five ways, and what asking the distance from one point costs</title>
  <rect width="900" height="250" fill="#f5f1e8"/>
  <defs>
    <path id="shape" d="M -48 28 Q -56 -18 -18 -34 Q 18 -46 42 -18 Q 58 6 34 28 Q 0 42 -48 28 Z"/>
    <clipPath id="inside"><use href="#shape"/></clipPath>
  </defs>

  <g transform="translate(90,90)">
    <g fill="#4a7fb0">
      <circle cx="-48" cy="28" r="2.6"/><circle cx="-52" cy="8" r="2.6"/><circle cx="-50" cy="-10" r="2.6"/>
      <circle cx="-34" cy="-27" r="2.6"/><circle cx="-16" cy="-35" r="2.6"/><circle cx="6" cy="-38" r="2.6"/>
      <circle cx="27" cy="-30" r="2.6"/><circle cx="43" cy="-16" r="2.6"/><circle cx="48" cy="4" r="2.6"/>
      <circle cx="40" cy="22" r="2.6"/><circle cx="20" cy="33" r="2.6"/><circle cx="-2" cy="35" r="2.6"/>
      <circle cx="-26" cy="33" r="2.6"/>
    </g>
    <circle cx="66" cy="-42" r="4" fill="#e06854"/>
    <line x1="66" y1="-42" x2="43" y2="-16" stroke="#e06854" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3f47">Point cloud</text>
    <text y="92" text-anchor="middle" font-size="13" fill="#6b7078">search, log n</text>
    <text y="110" text-anchor="middle" font-size="13" fill="#6b7078">to the spacing</text>
  </g>

  <g transform="translate(270,90)">
    <polygon points="-48,28 -52,-8 -18,-35 27,-30 48,4 20,33" fill="none" stroke="#4a7fb0" stroke-width="2"/>
    <g stroke="#4a7fb0" stroke-width="1" opacity="0.6">
      <line x1="-18" y1="-35" x2="20" y2="33"/><line x1="27" y1="-30" x2="20" y2="33"/>
      <line x1="-52" y1="-8" x2="20" y2="33"/>
    </g>
    <circle cx="66" cy="-42" r="4" fill="#e06854"/>
    <line x1="66" y1="-42" x2="37" y2="-13" stroke="#e06854" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3f47">Mesh</text>
    <text y="92" text-anchor="middle" font-size="13" fill="#6b7078">tree of boxes, log n</text>
    <text y="110" text-anchor="middle" font-size="13" fill="#6b7078">exact</text>
  </g>

  <g transform="translate(450,90)">
    <g fill="none" stroke="#4a7fb0">
      <use href="#shape" stroke-width="2.4"/>
      <use href="#shape" transform="scale(1.32)" stroke-width="1" opacity="0.65"/>
      <use href="#shape" transform="scale(1.62)" stroke-width="1" opacity="0.4"/>
      <use href="#shape" transform="scale(0.66)" stroke-width="1" opacity="0.65"/>
      <use href="#shape" transform="scale(0.34)" stroke-width="1" opacity="0.4"/>
    </g>
    <circle cx="66" cy="-42" r="4" fill="#e06854"/>
    <text y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3f47">Distance field</text>
    <text y="92" text-anchor="middle" font-size="13" fill="#3f9b5c" font-weight="700">a read, constant</text>
    <text y="110" text-anchor="middle" font-size="13" fill="#6b7078">to the voxel</text>
  </g>

  <g transform="translate(630,90)">
    <g fill="#4a7fb0">
      <ellipse cx="-30" cy="4" rx="24" ry="30" opacity="0.22"/>
      <ellipse cx="4" cy="-22" rx="30" ry="18" opacity="0.22"/>
      <ellipse cx="30" cy="4" rx="20" ry="26" opacity="0.22"/>
      <ellipse cx="-4" cy="24" rx="32" ry="15" opacity="0.22"/>
    </g>
    <circle cx="66" cy="-42" r="4" fill="#e06854"/>
    <text y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3f47">Density</text>
    <text y="92" text-anchor="middle" font-size="13" fill="#6b7078">a read, constant</text>
    <text y="110" text-anchor="middle" font-size="13" fill="#6b7078">a blur</text>
  </g>

  <g transform="translate(810,90)">
    <g stroke="#4a7fb0" stroke-width="2">
      <line x1="-46" y1="-34" x2="-46" y2="-8"/><line x1="-27" y1="-34" x2="-27" y2="24"/>
      <line x1="-8" y1="-34" x2="-8" y2="32"/><line x1="11" y1="-34" x2="11" y2="30"/>
      <line x1="30" y1="-34" x2="30" y2="12"/>
    </g>
    <circle cx="-46" cy="-8" r="3" fill="#4a7fb0"/><circle cx="-27" cy="24" r="3" fill="#4a7fb0"/>
    <circle cx="-8" cy="32" r="3" fill="#4a7fb0"/><circle cx="11" cy="30" r="3" fill="#4a7fb0"/>
    <circle cx="30" cy="12" r="3" fill="#4a7fb0"/>
    <text y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3f47">Depth image</text>
    <text y="92" text-anchor="middle" font-size="13" fill="#3f9b5c" font-weight="700">project, constant</text>
    <text y="110" text-anchor="middle" font-size="13" fill="#6b7078">along the ray</text>
  </g>
</svg>
